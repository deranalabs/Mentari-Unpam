<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Runner</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        width: 220px;
        padding: 10px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      #aiSettings {
        background: #238636;
        margin-top: 6px;
      }
      #aiSettings:hover {
        background: #1a6b29;
      }
    </style>
  </head>
  <body>
    <h3>Jalankan Token</h3>
    <button id="runToken">Jalankan</button>
    <button id="aiSettings">🤖 AI Settings</button>
    <script src="script.js"></script>
    <script>
      document.getElementById('aiSettings').onclick = function () {
        chrome.tabs.create({
          url: chrome.runtime.getURL('src/popup/ai-settings.html'),
        });
      };
    </script>
  </body>
</html>
