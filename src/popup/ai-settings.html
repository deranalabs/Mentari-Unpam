<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Mentari AI — Select Provider</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, monospace;
        width: 380px;
        background: #0d1117;
        color: #e6edf3;
        font-size: 13px;
      }

      /* === HEADER === */
      .header {
        padding: 14px 16px;
        border-bottom: 1px solid #21262d;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header h2 { font-size: 14px; font-weight: 600; }
      .header .badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 10px;
        background: #1c2333;
        color: #58a6ff;
        border: 1px solid #1f3a5f;
      }

      /* === PROVIDER LIST === */
      .section-title {
        padding: 10px 16px 6px;
        font-size: 11px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .provider-list { list-style: none; }
      .provider-item {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        cursor: pointer;
        transition: background 0.1s;
        border-left: 3px solid transparent;
      }
      .provider-item:hover { background: #161b22; }
      .provider-item.active {
        background: #1c2333;
        border-left-color: #58a6ff;
      }
      .provider-item .icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        margin-right: 12px;
        flex-shrink: 0;
      }
      .provider-item .info { flex: 1; min-width: 0; }
      .provider-item .name {
        font-size: 13px;
        font-weight: 500;
        color: #e6edf3;
      }
      .provider-item .desc {
        font-size: 11px;
        color: #8b949e;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .provider-item .arrow {
        color: #484f58;
        font-size: 14px;
        margin-left: 8px;
      }
      .provider-item.active .arrow { color: #58a6ff; }

      /* === DIVIDER === */
      .divider {
        border: none;
        border-top: 1px solid #21262d;
        margin: 0;
      }

      /* === CONFIG PANEL === */
      .config-panel {
        display: none;
        padding: 14px 16px;
        background: #161b22;
        border-top: 1px solid #21262d;
      }
      .config-panel.visible { display: block; }
      .config-panel label {
        display: block;
        font-size: 11px;
        color: #8b949e;
        margin: 10px 0 4px;
      }
      .config-panel label:first-child { margin-top: 0; }
      .config-panel input,
      .config-panel select {
        width: 100%;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
        font-size: 12px;
        outline: none;
      }
      .config-panel input:focus,
      .config-panel select:focus {
        border-color: #58a6ff;
      }
      .model-row {
        display: flex;
        gap: 6px;
      }
      .model-row select { flex: 1; }
      .model-row button {
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #8b949e;
        cursor: pointer;
        font-size: 13px;
      }
      .model-row button:hover {
        border-color: #58a6ff;
        color: #58a6ff;
      }

      /* === ACTIONS === */
      .actions {
        padding: 12px 16px;
        display: flex;
        gap: 8px;
        border-top: 1px solid #21262d;
      }
      .actions button {
        flex: 1;
        padding: 9px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: opacity 0.15s;
      }
      .actions button:hover { opacity: 0.85; }
      #testBtn { background: #30363d; color: #e6edf3; }
      #saveBtn { background: #238636; color: white; }

      /* === STATUS === */
      .status-bar {
        padding: 8px 16px;
        font-size: 11px;
        display: none;
      }
      .status-bar.ok {
        display: block;
        background: #0d2818;
        color: #3fb950;
        border-top: 1px solid #238636;
      }
      .status-bar.err {
        display: block;
        background: #2d1215;
        color: #f85149;
        border-top: 1px solid #f85149;
      }
      .status-bar.loading {
        display: block;
        background: #1c2333;
        color: #8b949e;
        border-top: 1px solid #30363d;
      }

      /* === FOOTER === */
      .footer {
        text-align: center;
        padding: 8px;
        font-size: 10px;
        color: #484f58;
        border-top: 1px solid #21262d;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <div class="header">
      <h2>🤖 Select Provider</h2>
      <span class="badge" id="activeBadge">currently active</span>
    </div>

    <!-- PROVIDER LIST -->
    <ul class="provider-list" id="providerList"></ul>

    <hr class="divider" />

    <!-- CONFIG PANEL (shown when provider selected) -->
    <div class="config-panel" id="configPanel">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." />

      <label for="model">Model</label>
      <div class="model-row">
        <select id="model"></select>
        <button id="fetchModels" title="Refresh models">↻</button>
      </div>

      <!-- Custom provider extra fields -->
      <div id="customFields" style="display:none">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" placeholder="https://api.example.com/v1" />
        <label for="authHeader">Auth Header</label>
        <input id="authHeader" value="Authorization" />
        <label for="authPrefix">Auth Prefix</label>
        <input id="authPrefix" value="Bearer " />
        <label for="chatPath">Chat Path</label>
        <input id="chatPath" value="/chat/completions" />
      </div>

      <label for="maxTokens">Max Tokens</label>
      <input id="maxTokens" type="number" value="2048" min="256" max="128000" />

      <label for="temperature">Temperature</label>
      <input id="temperature" type="number" value="0.7" min="0" max="2" step="0.1" />
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button id="testBtn">🧪 Test</button>
      <button id="saveBtn">💾 Save</button>
    </div>

    <!-- STATUS -->
    <div class="status-bar" id="statusBar"></div>

    <div class="footer">Mentari Mod v2.1 — Multi-Provider AI</div>

    <script src="ai-settings.js"></script>
  </body>
</html>
